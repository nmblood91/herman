server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /opt/greenthumb/frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # The camera stream is one response that never ends, so this location
    # exists only to turn buffering off. With buffering on, nginx accumulates
    # frames and releases them in batches: the picture still arrives, seconds
    # late and in jerks, which reads as a broken camera rather than as a proxy
    # setting. nginx matches the longest prefix, so this wins over /api/ below
    # whatever order they appear in.
    location /api/v1/camera/stream {
        proxy_pass http://127.0.0.1:8000/api/v1/camera/stream;
        proxy_http_version 1.1;
        proxy_buffering off;
        # The API gives up on a stalled capture after a few seconds and closes
        # the response itself, so this only has to be long enough not to cut a
        # healthy stream while someone watches it.
        proxy_read_timeout 1h;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_http_version 1.1;
        # Homing and full-rail moves do not answer until the gantry stops,
        # which outlasts the 60s default.
        proxy_read_timeout 180s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://127.0.0.1:8000/health;
        proxy_set_header Host $host;
    }

    # The generated API docs. Proxied because the API no longer listens on the
    # LAN itself, and this is the one endpoint list that cannot go stale.
    #
    # No exposure is added by this: every endpoint it documents is already
    # reachable through /api/ above, so hiding the documentation while leaving
    # the API open would be obscurity rather than security. When authentication
    # lands, this belongs behind it along with /api/.
    #
    # Swagger UI itself is pulled from a CDN, so the page needs internet on
    # whatever is viewing it. /redoc is deliberately not proxied.
    location /docs {
        proxy_pass http://127.0.0.1:8000/docs;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://127.0.0.1:8000/openapi.json;
        proxy_set_header Host $host;
    }
}
